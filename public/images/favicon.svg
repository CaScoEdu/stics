<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Sfondo blu coerente con il brand con angoli arrotondati -->
  <rect width="64" height="64" rx="14" fill="#007BFF"/>
  
  <!-- Parentesi/Cornice superiore -->
  <path d="M 14 23 V 14 H 50 V 23" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square"/>
  
  <!-- Parentesi/Cornice inferiore -->
  <path d="M 14 41 V 50 H 50 V 41" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="square"/>
  
  <!-- Nucleo centrale (cursore/nodo) -->
  <rect x="26" y="26" width="12" height="12" rx="2" fill="#FFFFFF"/>
</svg>
